# Student CRUD API - Berkinbay Abdigappar (ID 37409)
spring.application.name=berkinbay-abdigappar-student-api
server.port=8080

# Database settings come from environment variables (see docker-compose.yml and .env).
# The defaults below are only for running the app directly on your machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/berkinbay_abdigappar_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:berkinbay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.student.full-name=Berkinbay Abdigappar
app.student.id=37409
app.seed.enabled=${APP_SEED_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
