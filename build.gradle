plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

// Student: Berkinbay Abdigappar, ID 37409
group = 'kz.berkinbay'
version = '1.0'
description = 'Student CRUD API - Berkinbay Abdigappar (ID 37409)'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Writes META-INF/build-info.properties so the API can report its version
springBoot {
    buildInfo()
}

// Fixed JAR name so the Dockerfile can copy it reliably
bootJar {
    archiveFileName = 'berkinbay-abdigappar-student-api.jar'
}

// Only the executable Spring Boot JAR is needed
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
